apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning =
    releaseStoreFile &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

configurations {
    openNlpRuntimeSource
}

def patchedOpenNlpTools = tasks.register("patchedOpenNlpTools", Jar) {
    archiveFileName = "opennlp-tools-2.5.3-android.jar"
    destinationDirectory = layout.buildDirectory.dir("generated/opennlp")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.openNlpRuntimeSource.collect { zipTree(it) } }) {
        exclude "opennlp/tools/util/XmlUtil.class"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    }
}

android {
    namespace "com.solmi.lema"
    compileSdk rootProject.ext.compileSdkVersion
    flavorDimensions "distribution"
    sourceSets {
        main.assets.setSrcDirs([])
        standard.assets.srcDir("src/main/assets")
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        resources {
            pickFirsts += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/NOTICE",
                "model.properties",
            ]
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.solmi.lema"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10005
        versionName "1.0.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    productFlavors {
        standard {
            dimension "distribution"
            buildConfigField "boolean", "GRADSHOW_MODE", "false"
        }
        gradshow {
            dimension "distribution"
            applicationIdSuffix ".gradshow"
            versionNameSuffix "-gradshow"
            buildConfigField "boolean", "GRADSHOW_MODE", "true"
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def gradshowAssetsDir = file("$buildDir/generated/gradshowAssets")
def kiwiModelArchivePath = providers.gradleProperty("kiwiModelArchive")
    .orElse(providers.environmentVariable("KIWI_MODEL_ARCHIVE"))
    .orNull

tasks.register("prepareGradshowAssets", Sync) {
    from(file("src/main/assets")) {
        include "capacitor.plugins.json"
    }
    from(file("src/gradshow")) {
        include "capacitor.config.json"
    }
    from(rootProject.file("../dist-gradshow")) {
        into "public"
    }
    from(rootProject.file("../../releases/en/en-v1.1.2/en-v1.1.2-lemma.zip")) {
        into "packs"
    }
    from(rootProject.file("../../releases/de/de-v1.1.2/de-v1.1.2-lemma.zip")) {
        into "packs"
    }
    from(rootProject.file("../../releases/ru/ru-v1.1.2/ru-v1.1.2-lemma.zip")) {
        into "packs"
    }
    from(rootProject.file("../../releases/ko/ko-v1.1.2/ko-v1.1.2-lemma.zip")) {
        into "packs"
    }
    if (kiwiModelArchivePath) {
        from(file(kiwiModelArchivePath)) {
            into "models"
            rename { "kiwi_model_v0.24.0_base.tgz" }
        }
    }
    into gradshowAssetsDir
}

android.sourceSets.gradshow.assets.srcDir(gradshowAssetsDir)

tasks.configureEach { task ->
    if (task.name != "prepareGradshowAssets" && task.name.contains("Gradshow")) {
        task.dependsOn("prepareGradshowAssets")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"
    // Korean uses the same Kiwi analyzer family as the Electron backend's
    // kiwipiepy runtime. The native AAR is kept in app/libs because Kiwi does
    // not publish the Android binding to Maven Central.
    implementation files('libs/kiwi-android-v0.24.0.aar')
    // 2.5.4+ includes MethodHandle-based Snowball stemmers that D8 cannot
    // translate for this app's Android 7 (API 24) minimum. The experiment uses
    // 2.5.3 with trusted, version-pinned models while we evaluate either raising
    // minSdk to 26 or shipping a trimmed current runtime for production. Keep
    // the Android-compatible runtime in every variant. The much larger language
    // models remain outside the standard APK and are downloaded with the pack.
    openNlpRuntimeSource "org.apache.opennlp:opennlp-tools:2.5.3"
    compileOnly "org.apache.opennlp:opennlp-tools:2.5.3"
    implementation files(patchedOpenNlpTools.flatMap { it.archiveFile })

    // Debug and exhibition builds keep model resources for analyzer benchmarks.
    // Standard builds install these resources into filesDir/language-packs.
    gradshowImplementation "org.apache.opennlp:opennlp-models-sentdetect-en:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-tokenizer-en:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-pos-en:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-lemmatizer-en:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-sentdetect-de:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-tokenizer-de:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-pos-de:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-lemmatizer-de:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-sentdetect-ru:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-tokenizer-ru:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-pos-ru:1.3.0"
    gradshowImplementation "org.apache.opennlp:opennlp-models-lemmatizer-ru:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-sentdetect-en:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-tokenizer-en:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-pos-en:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-lemmatizer-en:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-sentdetect-de:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-tokenizer-de:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-pos-de:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-lemmatizer-de:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-sentdetect-ru:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-tokenizer-ru:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-pos-ru:1.3.0"
    debugImplementation "org.apache.opennlp:opennlp-models-lemmatizer-ru:1.3.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
