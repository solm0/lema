apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning =
    releaseStoreFile &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

android {
    namespace "com.solmi.lema"
    compileSdk rootProject.ext.compileSdkVersion
    flavorDimensions "distribution"
    sourceSets {
        main.assets.setSrcDirs([])
        standard.assets.srcDir("src/main/assets")
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.solmi.lema"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10004
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    productFlavors {
        standard {
            dimension "distribution"
            buildConfigField "boolean", "GRADSHOW_MODE", "false"
        }
        gradshow {
            dimension "distribution"
            applicationIdSuffix ".gradshow"
            versionNameSuffix "-gradshow"
            buildConfigField "boolean", "GRADSHOW_MODE", "true"
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def gradshowAssetsDir = file("$buildDir/generated/gradshowAssets")

tasks.register("prepareGradshowAssets", Sync) {
    from(file("src/main/assets")) {
        include "capacitor.plugins.json"
    }
    from(file("src/gradshow")) {
        include "capacitor.config.json"
    }
    from(rootProject.file("../dist-gradshow")) {
        into "public"
    }
    from(rootProject.file("../../releases/en/en-v1.1.2/en-v1.1.2-lemma.zip")) {
        into "packs"
    }
    into gradshowAssetsDir
}

android.sourceSets.gradshow.assets.srcDir(gradshowAssetsDir)

tasks.configureEach { task ->
    if (task.name != "prepareGradshowAssets" && task.name.contains("Gradshow")) {
        task.dependsOn("prepareGradshowAssets")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
