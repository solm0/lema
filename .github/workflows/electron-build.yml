name: Build Electron Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "app-desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target: mac
            artifact_name: lema-electron-macos
            artifact_glob: electron/dist-electron/*.dmg
          - os: windows-latest
            label: Windows
            target: win
            artifact_name: lema-electron-windows
            artifact_glob: electron/dist-electron/*.exe
          - os: ubuntu-latest
            label: Linux
            target: linux
            artifact_name: lema-electron-linux
            artifact_glob: electron/dist-electron/*.AppImage

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install electron dependencies
        run: npm ci
        working-directory: electron

      - name: Create backend venv
        run: python -m venv backend/venv

      - name: Install backend build dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          if [[ -x backend/venv/bin/python ]]; then
            BACKEND_PYTHON="backend/venv/bin/python"
          else
            BACKEND_PYTHON="backend/venv/Scripts/python.exe"
          fi
          "$BACKEND_PYTHON" -m pip install --upgrade pip
          "$BACKEND_PYTHON" -m pip install \
            aiosmtplib==5.1.0 \
            altgraph==0.17.5 \
            annotated-doc==0.0.4 \
            annotated-types==0.7.0 \
            anyio==4.13.0 \
            bce-python-sdk==0.9.70 \
            bcrypt==3.2.2 \
            blinker==1.9.0 \
            certifi==2026.4.22 \
            cffi==2.0.0 \
            chardet==7.4.3 \
            charset-normalizer==2.0.12 \
            click==8.3.3 \
            colorama==0.4.6 \
            colorlog==6.10.1 \
            crc32c==2.8 \
            cryptography==46.0.7 \
            dnspython==2.8.0 \
            ecdsa==0.19.2 \
            email-validator==2.3.0 \
            emoji==2.15.0 \
            fastapi==0.136.1 \
            fastapi-mail==1.6.2 \
            filelock==3.29.0 \
            flatbuffers==25.12.19 \
            fsspec==2026.4.0 \
            future==1.0.0 \
            h11==0.16.0 \
            hf-xet==1.4.3 \
            httpcore==1.0.9 \
            httpx==0.28.1 \
            huggingface_hub==1.12.0 \
            idna==3.13 \
            ImageIO==2.37.3 \
            imagesize==2.0.0 \
            Jinja2==3.1.6 \
            kiwipiepy==0.23.1 \
            kiwipiepy_model==0.23.0 \
            lazy-loader==0.5 \
            lxml==6.1.0 \
            macholib==1.16.4 \
            markdown-it-py==4.0.0 \
            MarkupSafe==3.0.3 \
            mdurl==0.1.2 \
            mpmath==1.3.0 \
            networkx==3.6.1 \
            ninja==1.13.0 \
            numpy==2.4.4 \
            opt-einsum==3.3.0 \
            packaging==26.2 \
            passlib==1.7.4 \
            pillow==12.2.0 \
            platformdirs==4.9.6 \
            prettytable==3.17.0 \
            protobuf==4.21.2 \
            psutil==7.2.2 \
            py-cpuinfo==9.0.0 \
            pyasn1==0.6.3 \
            pyclipper==1.4.0 \
            pycparser==3.0 \
            pycryptodome==3.23.0 \
            pydantic==2.13.3 \
            pydantic-settings==2.14.0 \
            pydantic_core==2.46.3 \
            Pygments==2.20.0 \
            pyinstaller==6.21.0 \
            pyinstaller-hooks-contrib==2026.6 \
            pypdfium2==5.7.1 \
            python-bidi==0.6.7 \
            python-dateutil==2.9.0.post0 \
            python-dotenv==1.2.2 \
            python-jose==3.5.0 \
            python-multipart==0.0.26 \
            PyYAML==6.0.2 \
            regex==2025.11.3 \
            requests==2.28.0 \
            rich==15.0.0 \
            rsa==4.9.1 \
            ruamel.yaml==0.19.1 \
            safetensors==0.7.0 \
            setuptools==82.0.1 \
            shapely==2.1.2 \
            shellingham==1.5.4 \
            six==1.17.0 \
            SQLAlchemy==2.0.49 \
            srt==3.5.3 \
            stanza==1.11.1 \
            starlette==0.52.1 \
            sympy==1.13.1 \
            termcolor==3.3.0 \
            torch==2.6.0 \
            tqdm==4.67.3 \
            typer==0.24.2 \
            typing-inspection==0.4.2 \
            typing_extensions==4.15.0 \
            udapi==0.5.2 \
            udtools==0.2.7 \
            ujson==5.12.0 \
            urllib3==1.26.20 \
            uvicorn==0.46.0 \
            wcwidth==0.6.0 \
            websockets==16.0

      - name: Build Electron package
        run: npm run build:bundle:${{ matrix.target }}
        working-directory: electron

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  publish-hf:
    name: Publish Hugging Face Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-desktop-v')
    runs-on: ubuntu-latest
    env:
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      HF_REPO_TYPE: ${{ vars.HF_REPO_TYPE || 'dataset' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      RELEASE_PLATFORM: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Hugging Face upload dependencies
        run: python -m pip install --upgrade huggingface_hub hf-xet httpx

      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Upload release assets to Hugging Face
        run: python scripts/upload_hf_release.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HF_XET_HIGH_PERFORMANCE: "1"
